syntax = "proto3";


package common;

// ResourceConfig represents a configuration item.
message ResourceConfig {
  string resource_key = 1;
  string alias = 2;
  string name = 3;
  string environment_key = 4;
  string pipeline_key = 5;
  string content = 6;
  string type = 7;
  string remark = 8;
  bool is_perm = 9;
  string description = 10;
  string edit_revision = 11; // server-owned editing token
  string scope_id = 12;      // current internal scope identity
}

// FileAsset represents an uploaded file.
message FileAsset {
  string file_id = 1;
  string environment_key = 2;
  string pipeline_key = 3;
  string file_name = 4;
  string content_type = 5;
  int64 file_size = 6;
  string url = 7;
  string remark = 8;
  string scope_id = 9;
}

// BaseResponse is the base response structure for all API responses.
// All responses follow: { code, msg, data: {...} }
message BaseResponse {
  int32 code = 1;
  string msg = 2;
  string error = 3;
}

// OperateResponse is a common response for operations (deprecated, use BaseResponse).
message OperateResponse {
  int32 code = 1;
  string msg = 2;
  string error = 3;
}

message Empty {}
