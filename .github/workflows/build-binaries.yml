name: Build Binaries

on:
  workflow_call:
    inputs:
      base_path:
        description: 'Base path for deployment'
        required: false
        default: ''
        type: string
    outputs:
      artifact_name_prefix:
        description: 'Prefix for uploaded artifacts'
        value: ${{ jobs.build-binaries.outputs.artifact_name_prefix }}

env:
  RUN_NAME: rainbow_bridge

jobs:
  build-binaries:
    name: Build ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            archive: tar.gz
            bin_ext: ""
          - goos: linux
            goarch: arm64
            archive: tar.gz
            bin_ext: ""
          - goos: windows
            goarch: amd64
            archive: zip
            bin_ext: ".exe"
          - goos: darwin
            goarch: amd64
            archive: tar.gz
            bin_ext: ""
          - goos: darwin
            goarch: arm64
            archive: tar.gz
            bin_ext: ""
    
    outputs:
      artifact_name_prefix: ${{ env.RUN_NAME }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: vue/package-lock.json

      - name: Build Vue frontend
        env:
          BASE_PATH: ${{ inputs.base_path }}
        run: |
          mkdir -p pkg/static/web
          cd vue
          npm ci
          export BASE_PATH="${BASE_PATH%/}/"
          npm run build
          cd ..
          cp -r vue/dist/* pkg/static/web/
          echo "Static files prepared at pkg/static/web"

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.x'
      
      - name: Download Go dependencies
        run: go mod download

      - name: Configure environment
        run: |
          echo "GOOS=${{ matrix.goos }}" >> "$GITHUB_ENV"
          echo "GOARCH=${{ matrix.goarch }}" >> "$GITHUB_ENV"
          echo "VERSION=${{ github.ref_name }}" >> "$GITHUB_ENV"
          echo "GIT_COMMIT=${{ github.sha }}" >> "$GITHUB_ENV"
          echo "BUILD_TIME=$(date -u '+%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"

      - name: Build app binary (with frontend)
        env:
          CGO_ENABLED: 0
          BASE_PATH: ${{ inputs.base_path }}
        run: |
          NAME="${{ env.RUN_NAME }}-app-${{ matrix.goos }}-${{ matrix.goarch }}"
          OUTPUT_DIR="./dist/${NAME}"
          mkdir -p "$OUTPUT_DIR"
          go build \
            -mod=readonly -trimpath \
            -ldflags="-X 'main.Version=${{ env.VERSION }}' -X 'main.GitCommit=${{ env.GIT_COMMIT }}' -X 'main.BuildTime=${{ env.BUILD_TIME }}' -X 'main.BasePath=${{ env.BASE_PATH }}'" \
            -o "$OUTPUT_DIR/app${{ matrix.bin_ext }}" .
          for TOOL in admin-password-reset backup-restore; do
            go build -mod=readonly -trimpath -o "$OUTPUT_DIR/${TOOL}${{ matrix.bin_ext }}" "./cmd/${TOOL}"
          done
          cp deploy/release/config.yaml "$OUTPUT_DIR/config.yaml"
          cp config.yaml "$OUTPUT_DIR/config.reference.yaml"
          cp deploy/release/QUICKSTART.md "$OUTPUT_DIR/QUICKSTART.md"
          cp "docs/releases/${VERSION}.md" "$OUTPUT_DIR/RELEASE_NOTES.md"
          cp -r docs/docs/api "$OUTPUT_DIR/api"
          cp -r deploy "$OUTPUT_DIR/deploy"
          cp -r pkg/static/web "$OUTPUT_DIR/web"

      - name: Package artifacts
        run: |
          cd dist
          for dir in */; do
            NAME="${dir%/}"
            if [ "${{ matrix.archive }}" = "zip" ]; then
              zip -rq "${NAME}.zip" "${NAME}"
            else
              tar czf "${NAME}.tar.gz" "${NAME}"
            fi
            rm -rf "${NAME}"
          done

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: "${{ env.RUN_NAME }}-${{ matrix.goos }}-${{ matrix.goarch }}"
          path: dist/*

  build-frontend-archive:
    name: Build Frontend Archive
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: vue/package-lock.json

      - name: Build Vue frontend
        env:
          BASE_PATH: ${{ inputs.base_path }}
        run: |
          cd vue
          npm ci
          export BASE_PATH="${BASE_PATH%/}/"
          npm run build
          cd ..

      - name: Create frontend archive
        run: |
          mkdir -p dist
          # 先将文件复制到临时目录，避免文件在读取过程中被修改
          mkdir -p /tmp/frontend
          cp -r vue/dist/* /tmp/frontend/
          # 使用-C选项指定目录，避免cd操作
          tar czf dist/frontend.tar.gz -C /tmp/frontend .
          (cd /tmp/frontend && zip -rq "$GITHUB_WORKSPACE/dist/frontend.zip" .)
          ls -la dist/

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v7
        with:
          name: frontend-archive
          path: dist/*
